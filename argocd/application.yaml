apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aetheric-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aetheric-forge/aetheric-web-k8s.git
    targetRevision: main
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: aetheric-forge
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: aethericforge-parallel-you-consumer
      namespace: aetheric-forge
      jsonPointers:
        - /data
        - /metadata/annotations/aetheric-forge~1deployment-id
        - /metadata/annotations/aetheric-forge~1plan-id
    - group: ""
      kind: Secret
      name: aethericforge-library-consumer
      namespace: aetheric-forge
      jsonPointers:
        - /data
        - /metadata/annotations/aetheric-forge~1deployment-id
        - /metadata/annotations/aetheric-forge~1plan-id
    - group: ""
      kind: Secret
      name: aethericforge-archive-consumer
      namespace: aetheric-forge
      jsonPointers:
        - /data
        - /metadata/annotations/aetheric-forge~1deployment-id
        - /metadata/annotations/aetheric-forge~1plan-id
    - group: ""
      kind: Secret
      name: aethericforge-decisions-consumer
      namespace: aetheric-forge
      jsonPointers:
        - /data
        - /metadata/annotations/aetheric-forge~1deployment-id
        - /metadata/annotations/aetheric-forge~1plan-id
    - group: ""
      kind: Secret
      name: aethericforge-decisions-consumer-v1
      namespace: aetheric-forge
      jsonPointers:
        - /data
        - /metadata/annotations/aetheric-forge~1deployment-id
        - /metadata/annotations/aetheric-forge~1plan-id
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
