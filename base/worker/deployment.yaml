apiVersion: apps/v1
kind: Deployment
metadata:
  name: aetheric-provisioning-worker
  namespace: aetheric-forge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aetheric-provisioning-worker
  template:
    metadata:
      labels:
        app: aetheric-provisioning-worker
    spec:
      serviceAccountName: aetheric-provisioning-worker
      imagePullSecrets:
        - name: aetheric-ghcr-secret
      containers:
        - name: worker
          image: ghcr.io/aetheric-forge/aetheric-provisioning-worker:sha-fdd63d5@sha256:9c36e2d6b9e37c9e73f999a3b236dc45570e07ea0a8ddd99f4e81f3c9c4b4260
          imagePullPolicy: IfNotPresent
          env:
            - name: Provisioning__ParallelYou__RegistryAuthority
              value: https://sso.aethericforge.ca
            - name: Provisioning__ParallelYou__PublicOrigin
              value: https://www.aethericforge.ca
            - name: Provisioning__ConsumerSecret__Namespace
              value: aetheric-forge
            - name: Provisioning__ConsumerSecret__Name
              value: aethericforge-parallel-you-consumer
            - name: DOTNET_ENVIRONMENT
              value: Production
            - name: SSL_CERT_FILE
              value: /var/run/aetheric-forge/trust/ca.crt
            - name: Provisioning__DataDirectory
              value: /data
            - name: Provisioning__SecretsKeyDirectory
              value: /data/secrets-key
            - name: Provisioning__WorkbenchTarget
              value: aetheric-provisioning-worker
            - name: RabbitMq__Host
              valueFrom:
                secretKeyRef:
                  name: aetheric-provisioning-worker-broker
                  key: RabbitMq__Host
            - name: RabbitMq__Port
              valueFrom:
                secretKeyRef:
                  name: aetheric-provisioning-worker-broker
                  key: RabbitMq__Port
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: aetheric-provisioning-worker-broker
                  key: RabbitMq__Username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: aetheric-provisioning-worker-broker
                  key: RabbitMq__Password
            - name: RabbitMq__VirtualHost
              valueFrom:
                secretKeyRef:
                  name: aetheric-provisioning-worker-broker
                  key: RabbitMq__VirtualHost
            - name: RabbitMq__Ssl
              valueFrom:
                secretKeyRef:
                  name: aetheric-provisioning-worker-broker
                  key: RabbitMq__Ssl
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: worker-data
              mountPath: /data
            - name: step-ca-root-ca
              mountPath: /var/run/aetheric-forge/trust
              readOnly: true
      volumes:
        - name: worker-data
          persistentVolumeClaim:
            claimName: aetheric-provisioning-worker-data
        - name: step-ca-root-ca
          configMap:
            name: step-ca-root-ca
            items:
              - key: ca.crt
                path: ca.crt
