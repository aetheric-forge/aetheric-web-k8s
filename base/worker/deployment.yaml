apiVersion: apps/v1
kind: Deployment
metadata:
  name: aetheric-provisioning-worker
  namespace: aetheric-forge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aetheric-provisioning-worker
  template:
    metadata:
      labels:
        app: aetheric-provisioning-worker
    spec:
      serviceAccountName: aetheric-provisioning-worker
      imagePullSecrets:
        - name: aetheric-ghcr-secret
      containers:
        - name: worker
          image: ghcr.io/aetheric-forge/aetheric-provisioning-worker:sha-4c46cce@sha256:b1c4163e649d8a15f7c48d8c2226193210676ff45e9de00c21a3fc8e94fe3572
          imagePullPolicy: IfNotPresent
          env:
            - name: Provisioning__Consumers__Environment
              value: production
            - name: Provisioning__Consumers__Library__SecretName
              value: aethericforge-library-consumer
            - name: Provisioning__Consumers__Archive__SecretName
              value: aethericforge-archive-consumer
            - name: Provisioning__Consumers__Decisions__SecretName
              value: aethericforge-decisions-consumer
            - name: Provisioning__ParallelYou__RegistryAuthority
              value: https://sso.aethericforge.ca
            - name: Provisioning__ParallelYou__PublicOrigin
              value: https://www.aethericforge.ca
            - name: Provisioning__ConsumerSecret__Namespace
              value: aetheric-forge
            - name: Provisioning__ConsumerSecret__Name
              value: aethericforge-parallel-you-consumer
            - name: DOTNET_ENVIRONMENT
              value: Production
            - name: SSL_CERT_FILE
              value: /var/run/aetheric-forge/trust/ca.crt
            - name: Provisioning__DataDirectory
              value: /data
            - name: Provisioning__SecretsKeyDirectory
              value: /data/secrets-key
            - name: Provisioning__WorkbenchTarget
              value: aetheric-provisioning-worker
            - name: RabbitMq__Host
              valueFrom:
                secretKeyRef:
                  name: aetheric-provisioning-worker-broker
                  key: RabbitMq__Host
            - name: RabbitMq__Port
              valueFrom:
                secretKeyRef:
                  name: aetheric-provisioning-worker-broker
                  key: RabbitMq__Port
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: aetheric-provisioning-worker-broker
                  key: RabbitMq__Username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: aetheric-provisioning-worker-broker
                  key: RabbitMq__Password
            - name: RabbitMq__VirtualHost
              valueFrom:
                secretKeyRef:
                  name: aetheric-provisioning-worker-broker
                  key: RabbitMq__VirtualHost
            - name: RabbitMq__Ssl
              valueFrom:
                secretKeyRef:
                  name: aetheric-provisioning-worker-broker
                  key: RabbitMq__Ssl
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: worker-data
              mountPath: /data
            - name: step-ca-root-ca
              mountPath: /var/run/aetheric-forge/trust
              readOnly: true
      volumes:
        - name: worker-data
          persistentVolumeClaim:
            claimName: aetheric-provisioning-worker-data
        - name: step-ca-root-ca
          configMap:
            name: step-ca-root-ca
            items:
              - key: ca.crt
                path: ca.crt
