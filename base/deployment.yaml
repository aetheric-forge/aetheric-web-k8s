apiVersion: apps/v1
kind: Deployment
metadata:
  name: aethericforge-web
  namespace: aetheric-forge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aethericforge-web
  template:
    metadata:
      annotations:
        aetheric-forge/consumer-revision: "public-sso-v1"
      labels:
        app: aethericforge-web
    spec:
      containers:
      - env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Production
        - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
          value: "true"
        - name: SSL_CERT_FILE
          value: /var/run/aetheric-forge/trust/ca.crt
        - name: PublicSite__Enabled
          value: "true"
        - name: PublicSite__SignInEnabled
          value: "true"
        - name: PublicSite__ProtectionKeyDirectory
          value: /data/parallel-you-signin-keys
        - name: ParallelYou__ProvisionedConfigurationPath
          value: /var/run/aetheric-forge/parallel-you/configuration.json
        - name: ParallelYou__DeploymentId
          value: f7448b244efacc5bf6b2decc4a7b0879eeb971dbf87e79657eb6735e9445318e
        - name: ParallelYou__Environment
          value: production
        envFrom:
        - secretRef:
            name: aethericforge-web-config
        image: ghcr.io/aetheric-forge/aethericforge-web:sha-557b514@sha256:3dfbe758a38c7af3bc57d181cd5fa50fc22407c6867c444b1abc193b4a248a65
        imagePullPolicy: Always
        name: aethericforge-web
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - mountPath: /data
          name: web-signin-data
        - mountPath: /var/run/aetheric-forge/trust
          name: step-ca-root-ca
          readOnly: true
        - mountPath: /var/run/aetheric-forge/parallel-you
          name: parallel-you-consumer
          readOnly: true
      volumes:
      - name: parallel-you-consumer
        secret:
          secretName: aethericforge-parallel-you-consumer
          items:
          - key: configuration.json
            path: configuration.json
      - name: web-signin-data
        persistentVolumeClaim:
          claimName: aethericforge-web-signin-data
      - configMap:
          items:
          - key: ca.crt
            path: ca.crt
          name: step-ca-root-ca
        name: step-ca-root-ca

