apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../base/admin
  - ../../base/worker
  - ingress.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: aethericforge-web
        namespace: aetheric-forge
      spec:
        template:
          spec:
            volumes:
              - name: web-signin-data
                persistentVolumeClaim:
                  claimName: aethericforge-web-signin-data-zone-a
